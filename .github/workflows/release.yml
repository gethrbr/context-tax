name: Release

# Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever controls the
# action's repository can repoint v7 at different code, and every workflow that trusts
# the tag runs it on the next push. That is the shape of most CI supply-chain attacks.
# A SHA cannot be repointed. The trailing `# v7` is there so Dependabot can still see
# what version the pin corresponds to and open a PR when a real release lands.

# Publishes to npm when a GitHub release is published. Manual dispatch is kept for a
# re-run after a transient registry failure; it will still refuse to publish a version
# that is already on the registry, because npm rejects a duplicate version outright.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token this job publishes with. It carries two jobs: npm's
      # trusted publisher accepts it in place of a long-lived token, and the registry
      # signs a provenance attestation tying the tarball to this run and this commit,
      # so an installer can check where it was built rather than taking our word.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          # `registry-url:` is deliberately absent. Setting it makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc. Under
          # trusted publishing there is no NODE_AUTH_TOKEN, so that line expands to an
          # empty token, npm reads it as "auth is already configured" and never starts
          # the OIDC exchange, and the publish dies with ENEEDAUTH against a registry
          # that would have accepted it. npm defaults to registry.npmjs.org on its own,
          # so the line buys nothing and costs the release. See actions/setup-node#1551.

      # OIDC publishing landed in npm 11.5.1. Node 22 ships npm 10, which would fall
      # back to token auth, find no token, and fail. Pinning to `latest` rather than an
      # exact version is deliberate here: this is the one place where being behind is
      # the failure mode, and the publish is gated by the tests below regardless.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The tag and the manifest have to agree. A release tagged v0.2.0 that publishes
      # 0.1.0 is worse than a failed release: it succeeds quietly and the tag lies.
      - name: tag matches package.json
        if: github.event_name == 'release'
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest tag=$tag"
          test "$manifest" = "$tag"

      # `prepublishOnly` runs typecheck, lint, the full suite and the build before the
      # tarball is made, so this line is the whole gate. --access public is explicit
      # rather than implied, so the package cannot become private by default later.
      #
      # There is no `env:` block and no NPM_TOKEN. Authentication is the OIDC token
      # minted above, exchanged with the registry for a credential that lives for this
      # job only, against the trusted publisher registered for this package. Nothing
      # long-lived exists to leak, and a stolen repo secret is no longer a way in.
      - run: npm publish --provenance --access public
